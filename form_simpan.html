<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pesanan | Coffee Shop Manis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="form-body">

    <div class="form-card">
        <a href="index.html" class="back-link">← Kembali ke Katalog</a>
        <h2>Konfirmasi Pesanan</h2>
        <p class="order-label">Produk Pilihan:</p>
        <h3 id="namaProduk" class="product-highlight">...</h3>
        
        <form id="orderFormMain">
            <div class="input-group">
                <label>Nama Pemesan</label>
                <input type="text" id="inputNama" placeholder="Masukkan nama Anda" required>
            </div>
            <div class="input-group">
                <label>Jumlah (Gelas)</label>
                <input type="number" id="inputJumlah" value="1" min="1">
            </div>
            <div class="input-group">
                <label>Alamat / No. Meja</label>
                <textarea id="inputAlamat" rows="3" placeholder="Tulis alamat atau nomor meja" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Simpan Pesanan</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
